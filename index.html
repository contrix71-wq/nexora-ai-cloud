<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#090a10">
<title>NEXORA</title>
<style>
*{box-sizing:border-box}
:root{--bg:#090a10;--panel:#10121c;--card:#171a27;--line:#252a3b;--accent:#8b83ff;--text:#f4f4ff;--muted:#9295aa}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button{cursor:pointer;font:inherit}
header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#0c0d15}
.logo{font-size:23px;font-weight:900;letter-spacing:3px}
.logo span{color:var(--accent)}
.status{font-size:12px;color:#a8a9bb}
.header-actions{display:flex;align-items:center;gap:12px}
.auth-button{background:#29243e;color:white;border:1px solid #514a7d;border-radius:10px;padding:9px 13px;font-size:12px}
#userLabel{font-size:11px;color:#aaa0ff}

.dot{display:inline-block;width:7px;height:7px;background:#43d99a;border-radius:50%;margin-right:7px}
.layout{max-width:1400px;margin:auto;display:flex;height:calc(100dvh - 68px)}
.sidebar{width:265px;background:#0d0f17;border-right:1px solid var(--line);padding:20px;flex-shrink:0}
.newchat{width:100%;padding:14px;background:linear-gradient(110deg,#766cff,#9a75ff);border:0;border-radius:13px;color:white;font-weight:700}
.section{font-size:11px;color:var(--muted);letter-spacing:1.5px;margin:28px 5px 12px}
#history{overflow:auto;max-height:65vh}
.chat-item{padding:12px;border-radius:10px;color:#b7b9ca;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:5px 0;cursor:pointer}
.chat-item:hover,.chat-item.active{background:#202137;color:white}
.content{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}
.topbar h2{font-size:16px;font-weight:600}
.model{font-size:11px;color:#b3aaff;background:#29243e;padding:8px 12px;border-radius:20px}
#messages{flex:1;overflow-y:auto;padding:25px max(18px,calc((100% - 760px)/2));scroll-behavior:smooth}
.welcome{text-align:center;margin:clamp(65px,16vh,150px) auto 0;max-width:500px}
.orb{width:75px;height:75px;margin:auto auto 23px;border-radius:25px;background:linear-gradient(135deg,#716bff,#b07bff);display:grid;place-items:center;font-size:32px;box-shadow:0 0 55px #8172ff55}
.welcome h1{font-size:35px;letter-spacing:2px;margin:0 0 12px}
.welcome p{color:var(--muted);font-size:14px;line-height:1.7}
.message{max-width:85%;padding:15px 17px;margin:15px 0;border-radius:17px;line-height:1.65;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{margin-left:auto;background:#343052;border:1px solid #514a7d;border-bottom-right-radius:5px}
.assistant{margin-right:auto;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}

.thinking{display:flex;align-items:center;gap:10px;color:#b3aaff}
.thinking-dots{display:flex;gap:4px}
.thinking-dots span{
width:6px;height:6px;border-radius:50%;
background:#9b83ff;
animation:thinkPulse 1.2s infinite ease-in-out;
box-shadow:0 0 8px #8b83ff88;
}
.thinking-dots span:nth-child(2){animation-delay:.2s}
.thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes thinkPulse{
0%,60%,100%{opacity:.3;transform:translateY(0)}
30%{opacity:1;transform:translateY(-5px)}
}

.sender{font-size:11px;color:#aaa0ff;margin-bottom:7px;font-weight:bold}
.composer-area{padding:15px 18px 20px;background:linear-gradient(transparent,#090a10 20%)}
.composer{max-width:800px;margin:auto;background:#151723;border:1px solid #34364c;border-radius:19px;padding:12px;box-shadow:0 10px 40px #0005}
#prompt{width:100%;background:transparent;border:0;outline:none;color:white;font-size:15px;padding:10px;resize:none;min-height:45px;max-height:130px;font-family:inherit}
.controls{display:flex;align-items:center;justify-content:space-between;padding-top:7px}
.tools{display:flex;gap:8px}
.tool{width:39px;height:39px;border:1px solid #33364a;border-radius:11px;background:#202232;color:#c4c0ff;font-size:19px}
.tool:hover{background:#34304f}
.send{width:43px;height:39px;background:linear-gradient(120deg,#776cff,#a176ff);border:0;border-radius:11px;color:white;font-size:19px}
.send:disabled{opacity:.4}
.hint{text-align:center;color:#666b80;font-size:10px;margin-top:11px}
#fileInput{display:none}
#attachments{display:flex;flex-wrap:wrap;gap:8px;padding:5px}
.file{position:relative;background:#25263a;border:1px solid #44445f;border-radius:10px;padding:8px 30px 8px 10px;font-size:11px;color:#ddd;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.remove{position:absolute;right:7px;top:5px;color:#ff8b9c;background:none;border:0;font-size:16px}
.preview{width:54px;height:54px;object-fit:cover;border-radius:8px}
.mobile-menu{display:none}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:15px}
@media(max-width:650px){
.layout{height:calc(100dvh - 68px)}
.sidebar{display:none;position:absolute;z-index:5;top:68px;bottom:0;width:85%;box-shadow:15px 0 40px #0009}
.sidebar.open{display:block}
.mobile-menu{display:block;background:none;border:0;color:white;font-size:23px}
.topbar{height:55px;padding:0 14px}
#messages{padding:15px 13px}
.message{max-width:94%}
.welcome{margin-top:clamp(55px,15vh,120px)}
.welcome h1{font-size:29px}
.composer-area{padding:10px 10px 14px}
}

.profile-panel{
  margin-top:24px;
  padding-top:16px;
  border-top:1px solid var(--line);
}
.profile-email{
  font-size:12px;
  color:#aaa0ff;
  overflow-wrap:anywhere;
  margin:10px 0;
}
.auth-button{
  width:100%;
  background:#29243e;
  color:white;
  border:1px solid #514a7d;
  border-radius:10px;
  padding:11px;
  font-size:13px;
}
.auth-button:disabled{opacity:.6}

</style>

<body>
<header>
<div class="logo">NEXORA<span>.</span></div>
<div class="status"><span class="dot"></span>Система готова</div>
</header>

<div class="layout">
<aside class="sidebar" id="sidebar">
<button class="newchat" onclick="newChat()">＋ Новый диалог</button>
<div class="section">ИСТОРИЯ ДИАЛОГОВ</div>
<div id="history"></div>
<div class="profile-panel">
  <div class="section">ПРОФИЛЬ</div>
  <div id="userLabel" class="profile-email">Не выполнен вход</div>
  <button id="authButton" class="auth-button">Войти через Google</button>

<div id="messages"></div>

<input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/webp,application/pdf,text/plain,text/csv,application/json,application/vnd.openxmlformats-officedocument.wordprocessingml.document,video/mp4,video/webm,audio/mp3,audio/mpeg,audio/wav,audio/aac,audio/m4a,.mp3,.wav,.aac,.m4a,.mp4,.webm,.docx,.jpg,.jpeg,.png,.webp,.pdf,.txt,.csv,.json" >

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://uljaleshmbmewwcerpxd.supabase.co";
const SUPABASE_KEY = "sb_publishable_CQKj0FxvLxtQ4SeV-CaccQ_ee7libZ_";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const authButton = document.getElementById("authButton");
const userLabel = document.getElementById("userLabel");

function updateAuthUI(session) {
    authButton.textContent = session ? "Выйти из аккаунта" : "Войти через Google";
    userLabel.textContent = session?.user?.email || "Не выполнен вход";
}

authButton.addEventListener("click", async () => {
    authButton.disabled = true;
    try {
        const { data } = await supabaseClient.auth.getSession();

        if (data.session) {
            const { error } = await supabaseClient.auth.signOut();
            if (error) throw error;
        } else {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: "google",
                options: { redirectTo: window.location.origin }
            });
            if (error) throw error;
        }
    } catch (error) {
        alert("Ошибка авторизации: " + error.message);
    } finally {
        authButton.disabled = false;
    }
});


let currentUserId = null;
let cloudReady = false;
let sessionLoadVersion = 0;
let cloudSaveQueue = Promise.resolve();

const STORAGE_KEY = "nexora_conversations_v1";
let conversations = [];
let currentId = null;
let waiting = false;
let selectedFiles = [];

function userStorageKey(userId) {
    return STORAGE_KEY + "_" + userId;
}

function readChats(key) {
    try {
        const value = JSON.parse(localStorage.getItem(key)) || [];
        return Array.isArray(value) ? value : [];
    } catch (e) {
        return [];
    }
}

function loadData() {
    conversations = readChats(STORAGE_KEY);
    if (conversations.length) {
        currentId = conversations[0].id;
    } else {
        newChat();
    }
    renderAll();
}

function saveData() {
    const key = currentUserId ? userStorageKey(currentUserId) : STORAGE_KEY;
    localStorage.setItem(key, JSON.stringify(conversations));

    if (!currentUserId || !cloudReady) return;

    const userId = currentUserId;
    const snapshot = conversations.map(chat => ({...chat}));

    cloudSaveQueue = cloudSaveQueue.then(async () => {
        if (currentUserId !== userId) return;

        for (const chat of snapshot) {
            const { error } = await supabaseClient
                .from("nexora_conversations")
                .upsert({
                    user_id: userId,
                    id: chat.id,
                    data: chat,
                    updated_at: new Date().toISOString()
                }, { onConflict: "user_id,id" });

            if (error) {
                console.error("Ошибка облачного сохранения:", error);
                break;
            }
        }
    }).catch(error => console.error("Ошибка синхронизации:", error));
}

async function handleAuthSession(session) {
    const userId = session?.user?.id || null;

    if (userId === currentUserId && cloudReady) return;

    const version = ++sessionLoadVersion;
    currentUserId = userId;
    cloudReady = false;

    if (!userId) {
        conversations = [];
        currentId = null;
        renderAll();
        newChat();
        return;
    }

    const localChats = readChats(userStorageKey(userId));
    const oldChats = readChats(STORAGE_KEY);

    try {
        const { data, error } = await supabaseClient
            .from("nexora_conversations")
            .select("id,data,updated_at")
            .order("updated_at", { ascending: false });

        if (version !== sessionLoadVersion) return;
        if (error) throw error;

        if (data && data.length) {
            conversations = data
                .map(row => row.data)
                .filter(chat => chat && typeof chat === "object" && Array.isArray(chat.messages))
                .sort((a, b) => Number(b.id) - Number(a.id));
        } else {
            conversations = localChats.length ? localChats : oldChats;

            if (conversations.length) {
                for (const chat of conversations) {
                    const { error: saveError } = await supabaseClient
                        .from("nexora_conversations")
                        .upsert({
                            user_id: userId,
                            id: chat.id,
                            data: chat,
                            updated_at: new Date().toISOString()
                        }, { onConflict: "user_id,id" });

                    if (saveError) throw saveError;
                }

                if (!localChats.length && oldChats.length) {
                    localStorage.removeItem(STORAGE_KEY);
                }
            }
        }

        if (version !== sessionLoadVersion) return;

        currentId = conversations[0]?.id || null;
        localStorage.setItem(userStorageKey(userId), JSON.stringify(conversations));
        cloudReady = true;

        if (!conversations.length) {
            newChat();
        } else {
            renderAll();
        }

    } catch (error) {
        if (version !== sessionLoadVersion) return;

        console.error("Ошибка загрузки облачной истории:", error);
        conversations = localChats;
        currentId = conversations[0]?.id || null;
        cloudReady = true;

        if (!conversations.length) {
            newChat();
        } else {
            renderAll();
        }

        alert("Не удалось загрузить облачную историю. Проверь интернет и настройки Supabase.");
    }
}

supabaseClient.auth.onAuthStateChange((_event, session) => {
    updateAuthUI(session);
    Promise.resolve().then(() => handleAuthSession(session));
});

supabaseClient.auth.getSession().then(({ data, error }) => {
    if (error) {
        console.error("Ошибка проверки входа:", error);
        return;
    }
    updateAuthUI(data.session);
    handleAuthSession(data.session);
});
function currentChat(){
return conversations.find(c=>c.id===currentId);
}
function newChat(){
if(waiting)return;
const chat={id:Date.now().toString(),title:"Новый диалог",messages:[]};
conversations.unshift(chat);
currentId=chat.id;
saveData();
renderAll();
document.getElementById("prompt").focus();
toggleSidebar(false);
}
function openChat(id){
if(waiting)return;
currentId=id;
renderAll();
toggleSidebar(false);
}
function toggleSidebar(force){
const s=document.getElementById("sidebar");
if(force===false)s.classList.remove("open");
else s.classList.toggle("open");
}
function renderHistory(){
const box=document.getElementById("history");
box.innerHTML="";
if(!conversations.length){
box.innerHTML='<div class="empty">История пока пуста</div>';
return;
}
conversations.forEach(chat=>{
const item=document.createElement("div");
item.className="chat-item"+(chat.id===currentId?" active":"");
item.textContent=chat.title;
item.onclick=()=>openChat(chat.id);
box.appendChild(item);
});
}

function appendInlineMarkdown(parent,text){
const pattern=/(\*\*[^*]+\*\*|\*[^*]+\*|`[^`]+`)/g;
let last=0, match;
while((match=pattern.exec(text))!==null){
parent.appendChild(document.createTextNode(text.slice(last,match.index)));
const token=match[0];
let node;
if(token.startsWith("**")){
node=document.createElement("strong");
node.textContent=token.slice(2,-2);
}else if(token.startsWith("*")){
node=document.createElement("em");
node.textContent=token.slice(1,-1);
}else{
node=document.createElement("code");
node.textContent=token.slice(1,-1);
node.style.background="#252525";
node.style.padding="2px 5px";
node.style.borderRadius="4px";
}
parent.appendChild(node);
last=pattern.lastIndex;
}
parent.appendChild(document.createTextNode(text.slice(last)));
}

function renderMarkdown(text,parent){
const lines=String(text||"").split(/\r?\n/);
let paragraph=[],list=null,codeLines=null;

function flushParagraph(){
if(!paragraph.length)return;
const p=document.createElement("p");
p.style.margin="6px 0";
appendInlineMarkdown(p,paragraph.join(" "));
parent.appendChild(p);
paragraph=[];
}
function flushList(){
if(!list)return;
parent.appendChild(list);
list=null;
}
for(const line of lines){
if(line.trim().startsWith("```")){
flushParagraph();
flushList();
if(codeLines===null){
codeLines=[];
}else{
const pre=document.createElement("pre");
const code=document.createElement("code");
code.textContent=codeLines.join("\n");
pre.appendChild(code);
pre.style.whiteSpace="pre-wrap";
pre.style.overflowX="auto";
pre.style.padding="12px";
pre.style.borderRadius="8px";
pre.style.background="#171717";
parent.appendChild(pre);
codeLines=null;
}
continue;
}
if(codeLines!==null){
codeLines.push(line);
continue;
}
const bullet=line.match(/^\s*[-*]\s+(.+)/);
if(bullet){
flushParagraph();
if(!list){
list=document.createElement("ul");
list.style.paddingLeft="22px";
}
const li=document.createElement("li");
appendInlineMarkdown(li,bullet[1]);
list.appendChild(li);
}else if(!line.trim()){
flushParagraph();
flushList();
}else{
flushList();
paragraph.push(line.trim());
}
}
flushParagraph();
flushList();
if(codeLines!==null){
const pre=document.createElement("pre");
pre.textContent=codeLines.join("\n");
pre.style.whiteSpace="pre-wrap";
parent.appendChild(pre);
}
}

function renderMessages(){
const box=document.getElementById("messages");
box.innerHTML="";
const chat=currentChat();
if(!chat)return;
if(!chat.messages.length){
const welcome=document.createElement("div");
welcome.className="welcome";
welcome.innerHTML='<div class="orb">✦</div><h1>NEXORA</h1><p>Твой интеллектуальный помощник.<br>Задавай вопросы, изучай новое и создавай идеи.</p>';
box.appendChild(welcome);
return;
}
chat.messages.forEach(msg=>{
const el=document.createElement("div");
el.className="message "+(msg.role==="user"?"user":"assistant");
if(msg.role==="assistant"){
const sender=document.createElement("div");
sender.className="sender";
sender.textContent="✦ NEXORA";
el.appendChild(sender);
}
const content=document.createElement("div");
if(msg.content==="NEXORA обрабатывает запрос..."){
content.className="thinking";
content.innerHTML='<span>NEXORA думает</span><span class="thinking-dots"><span></span><span></span><span></span></span>';
}else{
renderMarkdown(msg.content,content);
}
el.appendChild(content);
box.appendChild(el);
});
box.scrollTop=box.scrollHeight;
}
function renderAll(){
renderHistory();
renderMessages();
}
function renderFiles(){
const box=document.getElementById("attachments");
box.innerHTML="";
selectedFiles.forEach((file,index)=>{
const item=document.createElement("div");
item.className="file";
item.textContent=file.name;
const remove=document.createElement("button");
remove.className="remove";
remove.textContent="×";
remove.onclick=()=>removeFile(index);
item.appendChild(remove);
box.appendChild(item);
});
}

function mimeFromName(name){
const ext=name.toLowerCase().split(".").pop();
return ({
jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",
pdf:"application/pdf",txt:"text/plain",csv:"text/csv",json:"application/json",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",mp4:"video/mp4",webm:"video/webm",mp3:"audio/mp3",wav:"audio/wav",aac:"audio/aac",m4a:"audio/m4a"
})[ext]||"";
}

document.getElementById("fileInput").addEventListener("change",e=>{
const incoming=Array.from(e.target.files);
for(const file of incoming){
if(selectedFiles.length>=5){
alert("Можно выбрать не более 5 файлов");
break;
}
const mime=mimeFromName(file.name)||file.type;
const allowed=["image/jpeg","image/png","image/webp","application/pdf","text/plain","text/csv","application/json","application/vnd.openxmlformats-officedocument.wordprocessingml.document","video/mp4","video/webm","audio/mp3","audio/wav","audio/aac","audio/m4a"];
if(!allowed.includes(mime)){
alert("Формат пока не поддерживается: "+file.name);
continue;
}
if(file.size>10*1024*1024){
alert("Файл больше 10 МБ: "+file.name);
continue;
}
const total=selectedFiles.reduce((sum,f)=>sum+f.size,0);
if(total+file.size>12*1024*1024){
alert("Общий размер файлов не должен превышать 12 МБ");
continue;
}
selectedFiles.push(file);
}
renderFiles();
e.target.value="";
});
function removeFile(index){
selectedFiles.splice(index,1);
renderFiles();
}
function clearFiles(){
selectedFiles=[];
renderFiles();
}

async function sendMessage(){
if(waiting)return;

const input=document.getElementById("prompt");
const value=input.value.trim();

if(!value&&!selectedFiles.length)return;

const chat=currentChat();
if(!chat)return;

const message=value||"Проанализируй приложенные файлы.";
const userDisplay=value||"📎 "+selectedFiles.map(f=>f.name).join(", ");

chat.messages.push({role:"user",content:userDisplay});

if(chat.title==="Новый диалог"){
chat.title=userDisplay.length>27?userDisplay.slice(0,27)+"…":userDisplay;
}

input.value="";
waiting=true;
document.getElementById("send").disabled=true;

chat.messages.push({role:"assistant",content:"NEXORA обрабатывает запрос..."});
saveData();
renderAll();

try{
const filesPayload=await Promise.all(selectedFiles.map(file=>new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve({
name:file.name,
mime_type:mimeFromName(file.name)||file.type,
data:String(reader.result).split(",")[1]
});
reader.onerror=()=>reject(new Error("Не удалось прочитать файл: "+file.name));
reader.readAsDataURL(file);
})));

const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
if(sessionError) throw sessionError;
if(!sessionData.session) throw new Error("Войдите через Google, чтобы отправлять сообщения.");

const response=await fetch("http://127.0.0.1:8000/chat",{
method:"POST",
headers:{"Content-Type":"application/json","Authorization":"Bearer "+sessionData.session.access_token},
body:JSON.stringify({
message:message,
history:chat.messages.slice(0,-2).filter(m=>m.role==="user"||m.role==="assistant").slice(-12),
interaction_id:chat.interactionId||null,
files:filesPayload
})
});

const data=await response.json();
if(!response.ok)throw new Error(data.error||"Ошибка сервера");

chat.messages[chat.messages.length-1].content=data.message||"Пустой ответ сервера";

if(data.interaction_id){
chat.interactionId=data.interaction_id;
}

clearFiles();

}catch(error){
chat.messages[chat.messages.length-1].content=error.message||"Не удалось связаться с сервером.";
}

waiting=false;
document.getElementById("send").disabled=false;
saveData();
renderAll();
input.focus();
}

document.getElementById("prompt").addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});
loadData();
</script>
</body>
</html>
